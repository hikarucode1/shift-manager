# 本番の migration 適用状況を機械的に監視する (#204)。
#
# 2026-07-30: migration 0029-0032 が本番未適用のまま機能コードだけ deploy され、
# 通知機能が 9 日間動いていなかった。人手の「マージしたら適用状況を確認する」
# 運用では取りこぼすので、ここで自動化する。
#
# 2026-10-12: migration 0037 を本番に流す前に PR #304 をマージし、欠勤の画面が
# 落ちた。push / schedule だけだと**マージの後**にしか気づけないので、PR でも
# 動かしてマージの前に止める (#307)。PR のブランチの journal に、本番に未適用の
# migration があれば失敗する。本番に流してから「Re-run jobs」で緑にしてマージする。
#
# ⚠️ **PR では `pull_request_target` を使い、PR のコードを実行しない** (#307 の
# レビュー)。`pull_request` だと、PR のブランチの workflow・スクリプト・依存
# パッケージが本番の接続情報を持ったまま動き、レビュー前に本番へ任意の SQL を
# 流せてしまう。`pull_request_target` は **main の** workflow とスクリプトで動く。
# PR からは `drizzle/` (journal の JSON と .sql) を**データとして**取り出すだけで、
# 実行しない。この形なら fork からの PR も安全に確かめられる。
#
# ⚠️ そのため、この workflow の変更は main にマージされてから PR に効く。
name: migration guard

on:
  # マージの前に止める (#307)。ブランチ保護の required check にすると、赤い間は
  # マージできない
  pull_request_target:
    branches: [main]
    # base を main に変えたとき (edited) も動かす (ci.yml の #90 と同じ)
    types: [opened, synchronize, reopened, edited]
  # 機能 PR をマージした直後に気づけるようにする (7/30 の事故がこの形)
  push:
    branches: [main]
  # 適用漏れが「静かに」残り続けないよう毎朝も見る (06:00 JST = 21:00 UTC)
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  # PR ごとに分ける (main の監視と PR の確認が互いを待たないように)。
  # pull_request_target の github.ref は base (main) なので PR 番号で分ける
  group: migration-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check:migrations (production)
    runs-on: ubuntu-latest
    # 本番への問い合わせが固まったとき、既定の 6 時間待たされて全 PR がマージ
    # できなくなるのを防ぐ (ci.yml と同じ理由)
    timeout-minutes: 5
    # fork でスケジュール実行や push が走っても意味が無いので上流限定
    if: github.repository == 'hikarucode1/shift-manager'
    steps:
      # pull_request_target でも、ここで取るのは **main** (base) のコード
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Take migrations from the PR (data only)
        if: github.event_name == 'pull_request_target'
        # ⚠️ PR のファイルは drizzle/ だけを取り出し、何も実行しない。
        # npm ci もスクリプトも main のもの
        run: |
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
          rm -rf drizzle
          git checkout pr-head -- drizzle
          # PR が drizzle/ を変えたか (失敗時の案内の出し分けに使う)
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" pr-head -- drizzle; then
            echo "PR_TOUCHES_MIGRATIONS=0" >> "$GITHUB_ENV"
          else
            echo "PR_TOUCHES_MIGRATIONS=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require PROD_DATABASE_URL
        # 未設定なら **落とす**。skip にすると「監視しているつもりで何も見ていない」
        # 状態が静かに続き、この workflow が防ごうとしている事故と同じ形になる。
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${PROD_DATABASE_URL}" ]; then
            {
              echo "### secret \`PROD_DATABASE_URL\` が未設定です"
              echo ""
              echo "Settings > Secrets and variables > Actions > New repository secret に登録してください。"
              echo ""
              echo "- 値: Supabase ダッシュボードの上部にある緑の **Connect** ボタン > **Transaction pooler** (ポート 6543) の URI"
              echo "  (Settings 配下ではない。2026-08 時点の UI では左ナビに Database の項目は無い)"
              echo "- \`DATABASE_URL\` と別名にしているのは、他のジョブが誤って本番へ繋がないようにするため"
              echo "- 可能なら読み取り専用ロールの接続情報を使うこと (check:migrations は SELECT のみ)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::secret PROD_DATABASE_URL が未設定のため、本番の migration 適用状況を確認できません"
            exit 1
          fi

      - name: Check applied migrations
        env:
          # check-migrations は DIRECT_URL → DATABASE_URL の順に見る (SELECT のみ)
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          # 既定シェルは bash -e なので、失敗時に閉じ ``` まで到達するよう外す
          set +e
          set -o pipefail
          {
            echo "### check:migrations"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run check:migrations 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 失敗の理由で案内を分ける (#307 のレビュー)。PR が migration を
          # 変えていなければ、この PR のせいではない
          if [ $status -ne 0 ] && [ "${{ github.event_name }}" = "pull_request_target" ]; then
            if [ "${PR_TOUCHES_MIGRATIONS}" = "1" ]; then
              msg="この PR の migration が本番に未適用か、記録と食い違っています。レビューが済んで migration が確定してから本番に流し、この job を Re-run して緑にしてからマージしてください (docs/migration-policy.md)"
            else
              msg="この PR は migration を変えていません。main の migration が本番に未適用か、本番の migration テーブルを読めないなど、main か本番の側の問題です (上の出力を参照)"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**${msg}**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${msg}"
          fi
          exit $status
