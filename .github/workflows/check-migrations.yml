# 本番の migration 適用状況を機械的に監視する (#204)。
#
# 2026-07-30: migration 0029-0032 が本番未適用のまま機能コードだけ deploy され、
# 通知機能が 9 日間動いていなかった。人手の「マージしたら適用状況を確認する」
# 運用では取りこぼすので、ここで自動化する。
#
# 2026-10-12: migration 0037 を本番に流す前に PR #304 をマージし、欠勤の画面が
# 落ちた。push / schedule だけだと**マージの後**にしか気づけないので、PR でも
# 動かしてマージの前に止める (#307)。PR のブランチの journal に、本番に未適用の
# migration があれば失敗する。本番に流してから「Re-run jobs」で緑にしてマージする。
#
# ⚠️ fork からの PR には secret が渡らない (GitHub の仕様)。同じリポジトリの
# ブランチからの PR に限って動かす (job の if)。
name: migration guard

on:
  # マージの前に止める (#307)。ブランチ保護の required check にすると、赤い間は
  # マージできない
  pull_request:
    branches: [main]
  # 機能 PR をマージした直後に気づけるようにする (7/30 の事故がこの形)
  push:
    branches: [main]
  # 適用漏れが「静かに」残り続けないよう毎朝も見る (06:00 JST = 21:00 UTC)
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  # PR ごとに分ける (main の監視と PR の確認が互いを待たないように)
  group: migration-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check:migrations (production)
    runs-on: ubuntu-latest
    # fork でスケジュール実行や push が走っても意味が無いので上流限定。
    # PR は同じリポジトリのブランチからのものだけ (fork には secret が渡らない)
    if: >-
      github.repository == 'hikarucode1/shift-manager' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require PROD_DATABASE_URL
        # 未設定なら **落とす**。skip にすると「監視しているつもりで何も見ていない」
        # 状態が静かに続き、この workflow が防ごうとしている事故と同じ形になる。
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${PROD_DATABASE_URL}" ]; then
            {
              echo "### secret \`PROD_DATABASE_URL\` が未設定です"
              echo ""
              echo "Settings > Secrets and variables > Actions > New repository secret に登録してください。"
              echo ""
              echo "- 値: Supabase ダッシュボードの上部にある緑の **Connect** ボタン > **Transaction pooler** (ポート 6543) の URI"
              echo "  (Settings 配下ではない。2026-08 時点の UI では左ナビに Database の項目は無い)"
              echo "- \`DATABASE_URL\` と別名にしているのは、他のジョブが誤って本番へ繋がないようにするため"
              echo "- 可能なら読み取り専用ロールの接続情報を使うこと (check:migrations は SELECT のみ)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::secret PROD_DATABASE_URL が未設定のため、本番の migration 適用状況を確認できません"
            exit 1
          fi

      - name: Check applied migrations
        env:
          # check-migrations は DIRECT_URL → DATABASE_URL の順に見る (SELECT のみ)
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          # 既定シェルは bash -e なので、失敗時に閉じ ``` まで到達するよう外す
          set +e
          set -o pipefail
          {
            echo "### check:migrations"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run check:migrations 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo ""
              echo "**この PR の migration が本番に未適用です。マージの前に本番へ流してください** (#307)。"
              echo "流し方は docs/migration-policy.md と、各 migration の runbook。流したら、この job を Re-run して緑にしてからマージする。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::この PR の migration が本番に未適用です。本番に流してから Re-run してください"
          fi
          exit $status
