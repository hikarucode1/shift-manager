# 本番の migration 適用状況を機械的に監視する (#204)。
#
# 2026-07-30: migration 0029-0032 が本番未適用のまま機能コードだけ deploy され、
# 通知機能が 9 日間動いていなかった。人手の「マージしたら適用状況を確認する」
# 運用では取りこぼすので、ここで自動化する。
#
# 2026-10-12: migration 0037 を本番に流す前に PR #304 をマージし、欠勤の画面が
# 落ちた。push / schedule だけだと**マージの後**にしか気づけないので、PR でも
# 動かしてマージの前に止める (#307)。PR の journal に、本番に未適用の migration が
# あれば失敗する。本番に流してから「Re-run jobs」で緑にしてマージする。
#
# ⚠️ **このリポジトリは公開 (public)。** PR では `pull_request_target` で動かすので、
# 誰でも fork から PR を出せばこの job が本番に接続する (#307 のレビュー)。そのため:
#   - 接続には `drizzle.__drizzle_migrations` しか読めない専用ロールを使う
#     (secret `PROD_MIGRATIONS_READER_URL`)。漏れても読めるのは適用済みの一覧だけで、
#     その中身はもともとリポジトリに公開されている。強い権限の接続情報は使わない
#   - 動くのは **main の** workflow とスクリプトだけ。PR からは drizzle/ を**データ
#     として**取り出すだけで、PR のコードは実行しない
#   - PR の drizzle/ にシンボリックリンクなど通常のファイル以外があれば断る
#   - token は read のみ、ディスクに残さない
#
# ⚠️ この workflow の変更は main にマージされてから PR に効く (pull_request_target)。
name: migration guard

on:
  # マージの前に止める (#307)。ブランチ保護の required check にすると、赤い間は
  # マージできない
  pull_request_target:
    branches: [main]
    # base を main に変えたとき (edited) も動かす (ci.yml の #90 と同じ)。
    # ⚠️ タイトル・本文の編集でも飛ばさずに確かめる。job を skip すると required
    # check では「通った」扱いになり、赤い PR をタイトルの編集で通せてしまう。
    # 専用の読み取りロールなので、接続が増えても害は無い
    types: [opened, synchronize, reopened, edited]
  # 機能 PR をマージした直後に気づけるようにする (7/30 の事故がこの形)
  push:
    branches: [main]
  # 適用漏れが「静かに」残り続けないよう毎朝も見る (06:00 JST = 21:00 UTC)
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR と commit の組で分ける。PR 番号だけだと、待てるのは 1 本だけなので、
  # 編集で走った実行が新しい commit の確認を押し出して取り消しうる。
  # pull_request_target の github.ref は base (main) なので PR の値で分ける
  group: migration-guard-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: check:migrations (production)
    runs-on: ubuntu-latest
    # 本番への問い合わせが固まったとき、既定の 6 時間待たされて全 PR がマージ
    # できなくなるのを防ぐ。npm ci が冷えたキャッシュでも収まるよう余裕を見る
    timeout-minutes: 10
    # fork でスケジュール実行や push が走っても意味が無いので上流限定
    if: github.repository == 'hikarucode1/shift-manager'
    steps:
      # pull_request_target でも、ここで取るのは **main** (base) のコード
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # PR のときだけ全履歴 (分岐点からの差分に要る)。push / schedule は浅くてよい
          # ⚠️ 数値の 0 は式の中で偽になり `&& 0 || 1` が常に 1 になるので、文字列で書く
          fetch-depth: ${{ github.event_name == 'pull_request_target' && '0' || '1' }}

      - name: Take migrations from the PR (data only)
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # ⚠️ PR のファイルは drizzle/ だけを取り出し、何も実行しない。
        # npm ci もスクリプトも main のもの。取り出すのは確定した commit (head.sha)
        run: |
          set -euo pipefail
          # 公開リポジトリなので認証なしで取れる (persist-credentials: false)
          git fetch --no-tags origin "pull/${PR_NUMBER}/head" "${HEAD_SHA}"
          if ! git cat-file -e "${HEAD_SHA}:drizzle" 2>/dev/null; then
            msg="この PR には drizzle/ がありません。migration の置き場所を変える場合は、この workflow も合わせて直してください"
            echo "**${msg}**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${msg}"
            exit 1
          fi
          # 通常のファイル (100644 / 100755) とディレクトリ以外 (シンボリックリンク
          # 120000、サブモジュール 160000) があれば断る。リンクだと、名前の形の
          # チェックをすり抜けて drizzle/ の外を読ませられる
          bad=$(git ls-tree -r "${HEAD_SHA}" -- drizzle | awk '$1 != "100644" && $1 != "100755"')
          if [ -n "${bad}" ]; then
            msg="この PR の drizzle/ に通常のファイル以外 (シンボリックリンクなど) があります"
            echo "**${msg}**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${msg}"
            exit 1
          fi
          rm -rf drizzle
          git checkout "${HEAD_SHA}" -- drizzle
          # PR が drizzle/ を変えたか (失敗時の案内の出し分けに使う)。分岐点からの
          # 差分で見る (main が後から進んでも、この PR の変更だけを見る)
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- drizzle; then
            echo "PR_TOUCHES_MIGRATIONS=0" >> "$GITHUB_ENV"
          else
            echo "PR_TOUCHES_MIGRATIONS=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require PROD_MIGRATIONS_READER_URL
        # 未設定なら **落とす**。skip にすると「監視しているつもりで何も見ていない」
        # 状態が静かに続き、この workflow が防ごうとしている事故と同じ形になる。
        env:
          READER_URL: ${{ secrets.PROD_MIGRATIONS_READER_URL }}
        run: |
          if [ -z "${READER_URL}" ]; then
            {
              echo "### secret \`PROD_MIGRATIONS_READER_URL\` が未設定です"
              echo ""
              echo "\`drizzle.__drizzle_migrations\` しか読めない専用ロールの接続情報を登録してください (#307)。"
              echo "ロールの作り方と接続文字列の形は docs/migration-policy.md の「migration guard の専用ロール」。"
              echo "**強い権限の接続情報は登録しないこと** (公開リポジトリで、fork の PR からも動くため)。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::secret PROD_MIGRATIONS_READER_URL が未設定のため、本番の migration 適用状況を確認できません"
            exit 1
          fi

      - name: Check applied migrations
        env:
          # check-migrations は DIRECT_URL → DATABASE_URL の順に見る (SELECT のみ)
          DATABASE_URL: ${{ secrets.PROD_MIGRATIONS_READER_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 既定シェルは bash -e なので、失敗時に閉じ ``` まで到達するよう外す
          set +e
          set -o pipefail
          {
            echo "### check:migrations"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run check:migrations 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 失敗の理由で案内を分ける (#307 のレビュー)。終了コードは
          # scripts/check-migrations.ts: 1 = 未適用、2 = 本番を読めない、3 = journal が不正
          if [ $status -ne 0 ] && [ "${EVENT_NAME}" = "pull_request_target" ]; then
            if [ $status -eq 2 ]; then
              msg="本番の migration テーブルを読めませんでした (接続や権限の問題)。migration を本番に流しても直りません。secret PROD_MIGRATIONS_READER_URL と専用ロールを確かめてください"
            elif [ $status -eq 3 ]; then
              msg="この PR の drizzle/meta/_journal.json か .sql が想定外の形です (上の出力を参照)"
            elif [ "${PR_TOUCHES_MIGRATIONS:-0}" = "1" ]; then
              msg="この PR の migration が本番に未適用か、記録と食い違っています。レビューが済んで migration が確定してから本番に流し、この job を Re-run して緑にしてからマージしてください (docs/migration-policy.md)"
            else
              msg="この PR は migration を変えていません。main の migration が本番に未適用か、本番の migration テーブルを読めないなど、main か本番の側の問題です (上の出力を参照)"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**${msg}**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${msg}"
          fi
          exit $status
