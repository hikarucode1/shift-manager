<h2>パスワードの再設定</h2>

<p>シフト管理アプリ「Shift Manager」のパスワード再設定の案内です。</p>

<p>下のボタンを押して、新しいパスワードを決めてください。</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
     style="display:inline-block;padding:10px 20px;background:#111827;color:#ffffff;border-radius:6px;text-decoration:none;">
    パスワードを再設定する
  </a>
</p>

<p>このリンクは 1 回だけ使えます。有効期限が切れた場合は教室長に再送を依頼してください。</p>

<p>心当たりがない場合は、このメールを無視してください。リンクを押さなければパスワードは変わりません。</p>

<p style="color:#6b7280;font-size:12px;">このメールは送信専用です。返信いただいてもお答えできません。</p>
